<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            /* In this blueprint system, icons are represented by squares with slashes */
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 1px solid black;
            position: relative;
            font-size: 0;
        }
        .material-symbols-outlined::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top right, transparent calc(50% - 0.5px), black, transparent calc(50% + 0.5px));
        }

        .hatch-bg {
            background-image: repeating-linear-gradient(45deg, #c6c6c6, #c6c6c6 1px, transparent 1px, transparent 10px);
        }

        .wavy-line {
            height: 2px;
            width: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='10' viewBox='0 0 40 10' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 5 Q 5 0, 10 5 T 20 5 T 30 5 T 40 5' stroke='%23777777' fill='transparent' stroke-width='2'/%3E%3C/svg%3E");
            background-repeat: repeat-x;
        }

        .heavy-bar {
            height: 8px;
            background-color: #000000;
        }

        .utility-line {
            height: 2px;
            background-color: #000000;
        }

        .skeleton-x {
            position: relative;
        }
        .skeleton-x::before, .skeleton-x::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .skeleton-x::before {
            background: linear-gradient(to top right, transparent calc(50% - 1px), #c6c6c6, transparent calc(50% + 1px));
        }
        .skeleton-x::after {
            background: linear-gradient(to bottom right, transparent calc(50% - 1px), #c6c6c6, transparent calc(50% + 1px));
        }
    </style>
</head>
