<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wireframe Sketch</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-container": "#747474",
                    "surface-container": "#eeeeee",
                    "on-primary-container": "#ffffff",
                    "secondary": "#5e5e5e",
                    "on-tertiary": "#e2e2e2",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed-variant": "#e2e2e2",
                    "on-error": "#ffffff",
                    "on-tertiary-container": "#ffffff",
                    "on-secondary-container": "#1b1b1b",
                    "surface-container-high": "#e8e8e8",
                    "surface": "#f9f9f9",
                    "outline-variant": "#c6c6c6",
                    "primary-container": "#3b3b3b",
                    "on-secondary-fixed-variant": "#3b3b3b",
                    "on-background": "#1a1c1c",
                    "primary": "#000000",
                    "surface-tint": "#5e5e5e",
                    "secondary-fixed-dim": "#ababab",
                    "background": "#f9f9f9",
                    "on-primary": "#e2e2e2",
                    "tertiary-fixed-dim": "#474747",
                    "outline": "#777777",
                    "surface-dim": "#dadada",
                    "on-surface": "#1a1c1c",
                    "error-container": "#ffdad6",
                    "error": "#ba1a1a",
                    "surface-bright": "#f9f9f9",
                    "surface-container-highest": "#e2e2e2",
                    "surface-container-low": "#f3f3f4",
                    "secondary-container": "#d4d4d4",
                    "on-tertiary-fixed": "#ffffff",
                    "on-error-container": "#410002",
                    "on-primary-fixed": "#ffffff",
                    "inverse-primary": "#c6c6c6",
                    "tertiary": "#3b3b3b",
                    "surface-variant": "#e2e2e2",
                    "primary-fixed-dim": "#474747",
                    "primary-fixed": "#5e5e5e",
                    "tertiary-fixed": "#5e5e5e",
                    "on-tertiary-fixed-variant": "#e2e2e2",
                    "inverse-surface": "#2f3131",
                    "surface-container-lowest": "#ffffff",
                    "inverse-on-surface": "#f0f1f1",
                    "secondary-fixed": "#c6c6c6",
                    "on-surface-variant": "#474747",
                    "on-secondary-fixed": "#1b1b1b"
            },
            "borderRadius": {
                    "DEFAULT": "0px",
                    "lg": "0px",
                    "xl": "0px",
                    "full": "0px"
            },
            "fontFamily": {
                    "headline": ["Space Grotesk"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hatch-pattern {
            background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(198, 198, 198, 0.2) 5px, rgba(198, 198, 198, 0.2) 6px);
        }
        .wavy-line {
            height: 2px;
            background-color: #777777;
            mask-image: radial-gradient(circle at 50% 100%, black 25%, transparent 35%);
            mask-size: 10px 4px;
            mask-repeat: repeat-x;
            width: 100%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-white text-black font-body antialiased">
<!-- TopAppBar Shell -->
<header class="flex justify-between items-center px-4 h-16 w-full bg-white border-b-2 border-black sticky top-0 z-50">
<div class="flex items-center space-x-4">
<span class="material-symbols-outlined text-black" data-icon="square">square</span>
<div class="h-2 w-32 bg-black"></div>
</div>
<div class="flex space-x-2">
<div class="w-8 h-8 border border-black flex items-center justify-center">
<span class="material-symbols-outlined text-xs" data-icon="square">square</span>
</div>
</div>
</header>
<main class="min-h-screen px-6 py-8 space-y-12">
<!-- Primary Action Placeholder (Top Button) -->
<section class="w-full">
<div class="border-2 border-black w-full h-14 flex items-center justify-center bg-white">
<div class="h-[3px] w-24 bg-black"></div>
</div>
</section>
<!-- Form Layout Section -->
<section class="space-y-6">
<!-- Vertical stack of 4 input placeholders -->
<div class="space-y-4">
<!-- Input 1 -->
<div class="space-y-2">
<div class="h-[2px] w-12 bg-black"></div> <!-- Label Placeholder -->
<div class="border border-black w-full h-12 flex items-center px-4 bg-white">
<div class="h-[1px] w-32 bg-outline"></div> <!-- Content Placeholder -->
</div>
</div>
<!-- Input 2 -->
<div class="space-y-2">
<div class="h-[2px] w-16 bg-black"></div>
<div class="border border-black w-full h-12 flex items-center px-4 bg-white">
<div class="h-[1px] w-48 bg-outline"></div>
</div>
</div>
<!-- Input 3 -->
<div class="space-y-2">
<div class="h-[2px] w-20 bg-black"></div>
<div class="border border-black w-full h-12 flex items-center px-4 bg-white">
<div class="h-[1px] w-28 bg-outline"></div>
</div>
</div>
<!-- Input 4 -->
<div class="space-y-2">
<div class="h-[2px] w-14 bg-black"></div>
<div class="border border-black w-full h-12 flex items-center px-4 bg-white">
<div class="h-[1px] w-40 bg-outline"></div>
</div>
</div>
</div>
</section>
<!-- Secondary Decoration / Structure -->
<section class="pt-8 border-t border-outline-variant">
<div class="grid grid-cols-2 gap-4">
<div class="aspect-square border border-outline-variant flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-full h-[1px] bg-outline-variant rotate-45"></div>
<div class="w-full h-[1px] bg-outline-variant -rotate-45"></div>
</div>
</div>
<div class="aspect-square border border-outline-variant flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-full h-[1px] bg-outline-variant rotate-45"></div>
<div class="w-full h-[1px] bg-outline-variant -rotate-45"></div>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-6 bg-white border-t-2 border-black">
<div class="bg-black text-white p-2 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="square">square</span>
</div>
<div class="border border-black p-2 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="square">square</span>
</div>
<div class="border border-black p-2 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="square">square</span>
</div>
<div class="border border-black p-2 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="square">square</span>
</div>
</nav>
<!-- Padding for bottom nav -->
<div class="h-24"></div>
</body></html>
