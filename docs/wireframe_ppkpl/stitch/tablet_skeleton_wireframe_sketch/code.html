<style>
        .blueprint-x {

            left: 0;
            right: 0;
            bottom: 0;
            background: currentColor;
            pointer-events: none;
        }
        .blueprint-x::before {
            clip-path: polygon(0 0, 1px 0, 100% 100%, calc(100% - 1px) 100%);
        }
        .blueprint-x::after {
