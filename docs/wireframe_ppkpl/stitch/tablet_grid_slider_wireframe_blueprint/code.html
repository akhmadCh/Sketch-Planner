<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-container": "#1b1b1b",
                    "surface-tint": "#5e5e5e",
                    "surface-dim": "#dadada",
                    "on-secondary-fixed": "#1b1b1b",
                    "error-container": "#ffdad6",
                    "on-primary-container": "#ffffff",
                    "on-error": "#ffffff",
                    "tertiary-fixed-dim": "#474747",
                    "primary": "#000000",
                    "on-background": "#1a1c1c",
                    "secondary-container": "#d4d4d4",
                    "on-surface": "#1a1c1c",
                    "primary-fixed-dim": "#474747",
                    "on-secondary": "#ffffff",
                    "inverse-surface": "#2f3131",
                    "secondary": "#5e5e5e",
                    "on-tertiary-container": "#ffffff",
                    "outline-variant": "#c6c6c6",
                    "surface": "#f9f9f9",
                    "on-primary-fixed": "#ffffff",
                    "outline": "#777777",
                    "surface-bright": "#f9f9f9",
                    "on-tertiary-fixed": "#ffffff",
                    "on-primary": "#e2e2e2",
                    "error": "#ba1a1a",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-high": "#e8e8e8",
                    "secondary-fixed-dim": "#ababab",
                    "primary-fixed": "#5e5e5e",
                    "inverse-primary": "#c6c6c6",
                    "on-error-container": "#410002",
                    "inverse-on-surface": "#f0f1f1",
                    "surface-container-highest": "#e2e2e2",
                    "surface-variant": "#e2e2e2",
                    "on-surface-variant": "#474747",
                    "surface-container": "#eeeeee",
                    "tertiary-fixed": "#5e5e5e",
                    "surface-container-low": "#f3f3f4",
                    "background": "#f9f9f9",
                    "on-tertiary": "#e2e2e2",
                    "tertiary-container": "#747474",
                    "tertiary": "#3b3b3b",
                    "primary-container": "#3b3b3b",
                    "on-tertiary-fixed-variant": "#e2e2e2",
                    "on-secondary-fixed-variant": "#3b3b3b",
                    "on-primary-fixed-variant": "#e2e2e2",
                    "secondary-fixed": "#c6c6c6"
            },
            "borderRadius": {
                    "none": "0px",
                    "DEFAULT": "0px",
                    "lg": "0px",
                    "xl": "0px",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Space Grotesk"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hatch-pattern {
            background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, #c6c6c6 5px, #c6c6c6 6px);
        }
        .blueprint-bg {
            background-color: #ffffff;
            background-image: linear-gradient(#f0f0f0 1px, transparent 1px), linear-gradient(90deg, #f0f0f0 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-white font-body antialiased overflow-hidden">
<!-- Tablet Container (4:3 Aspect Ratio Simulation) -->
<div class="relative mx-auto my-10 w-[1024px] h-[768px] border-4 border-black bg-white flex overflow-hidden">
<!-- Side Navigation (Shared Component Execution) -->
<nav class="flex flex-col h-full w-20 border-r-2 border-black bg-neutral-50 font-['Space_Grotesk']">
<div class="p-4 border-b-2 border-black flex flex-col items-center">
<div class="w-8 h-8 border-2 border-black bg-black mb-1"></div>
<div class="h-2 w-10 bg-black"></div>
</div>
<div class="flex-1 flex flex-col items-center py-8 space-y-8">
<!-- Active Item -->
<div class="w-12 h-12 bg-black flex items-center justify-center step-transition">
<span class="material-symbols-outlined text-white" data-icon="square">square</span>
</div>
<!-- Inactive Items -->
<div class="w-12 h-12 border border-neutral-300 flex items-center justify-center hover:invert transition-all">
<span class="material-symbols-outlined" data-icon="square">square</span>
</div>
<div class="w-12 h-12 border border-neutral-300 flex items-center justify-center hover:invert transition-all">
<span class="material-symbols-outlined" data-icon="square">square</span>
</div>
<div class="w-12 h-12 border border-neutral-300 flex items-center justify-center hover:invert transition-all">
<span class="material-symbols-outlined" data-icon="square">square</span>
</div>
</div>
<div class="p-4 flex justify-center">
<div class="w-8 h-8 border-2 border-black"></div>
</div>
</nav>
<div class="flex-1 flex flex-col">
<!-- Top App Bar (Shared Component Execution) -->
<header class="flex justify-between items-center w-full px-6 py-4 border-b-2 border-black bg-neutral-50 font-['Space_Grotesk'] font-bold tracking-tighter">
<div class="flex items-center space-x-4">
<div class="text-xl font-black uppercase text-black">BLUEPRINT_v01</div>
</div>
<div class="flex items-center space-x-6">
<div class="h-1 w-24 bg-neutral-400"></div>
<div class="h-1 w-24 bg-neutral-400"></div>
<div class="scale-95 transition-transform p-2">
<span class="material-symbols-outlined" data-icon="square">square</span>
</div>
</div>
</header>
<!-- Main Blueprint Content Canvas -->
<main class="flex-1 p-12 bg-white blueprint-bg flex flex-col space-y-12">
<!-- Skeleton Header Area -->
<div class="space-y-4">
<div class="h-12 w-2/3 bg-black"></div> <!-- Display-LG Redacted Headline -->
<div class="h-1 w-1/3 bg-outline"></div> <!-- Body-MD Redacted Subtitle -->
</div>
<!-- 2x2 Grid Layout -->
<div class="grid grid-cols-2 gap-8 flex-1">
<!-- Square Box 1 -->
<div class="border-2 border-black p-8 bg-surface-container-lowest flex flex-col justify-between">
<div class="space-y-4">
<div class="h-4 w-3/4 bg-black"></div>
<div class="space-y-2">
<div class="h-0.5 w-full bg-outline"></div>
<div class="h-0.5 w-full bg-outline"></div>
<div class="h-0.5 w-2/3 bg-outline"></div>
</div>
</div>
<div class="h-10 w-24 border-2 border-black"></div> <!-- Secondary Button Placeholder -->
</div>
<!-- Square Box 2 -->
<div class="border-2 border-black p-8 bg-surface-container-lowest flex flex-col justify-between">
<div class="space-y-4">
<div class="h-4 w-1/2 bg-black"></div>
<div class="space-y-2">
<div class="h-0.5 w-full bg-outline"></div>
<div class="h-0.5 w-full bg-outline"></div>
<div class="h-0.5 w-4/5 bg-outline"></div>
</div>
</div>
<div class="h-10 w-10 border-2 border-black bg-black"></div>
</div>
<!-- Square Box 3 -->
<div class="border-2 border-black p-8 bg-surface-container-lowest flex flex-col justify-between">
<div class="space-y-4">
<div class="h-4 w-2/3 bg-black"></div>
<div class="space-y-2">
<div class="h-0.5 w-full bg-outline"></div>
<div class="h-0.5 w-full bg-outline"></div>
<div class="h-0.5 w-full bg-outline"></div>
</div>
</div>
<div class="flex space-x-2">
<div class="h-6 w-12 border border-outline"></div>
<div class="h-6 w-12 border border-outline"></div>
</div>
</div>
<!-- Square Box 4 -->
<div class="border-2 border-black p-8 bg-surface-container-lowest flex flex-col justify-between overflow-hidden relative">
<!-- Diagonal Hatch for Active State indication -->
<div class="absolute inset-0 hatch-pattern opacity-10 pointer-events-none"></div>
<div class="space-y-4 relative">
<div class="h-4 w-5/6 bg-black"></div>
<div class="space-y-2">
<div class="h-0.5 w-full bg-outline"></div>
<div class="h-0.5 w-3/4 bg-outline"></div>
</div>
</div>
<div class="w-full h-24 border border-outline-variant relative">
<!-- Image Placeholder "X" -->
<svg class="absolute inset-0 w-full h-full text-outline-variant" preserveaspectratio="none">
<line stroke="currentColor" stroke-width="1" x1="0" x2="100%" y1="0" y2="100%"></line>
<line stroke="currentColor" stroke-width="1" x1="100%" x2="0" y1="0" y2="100%"></line>
</svg>
</div>
</div>
</div>
<!-- Slider Placeholder Section -->
<div class="py-8 flex flex-col space-y-6">
<div class="flex justify-between items-end">
<div class="h-1 w-20 bg-black"></div>
<div class="h-1 w-12 bg-outline-variant"></div>
</div>
<div class="relative h-1 w-full bg-neutral-200">
<div class="absolute inset-y-0 left-0 w-1/2 bg-black"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-6 h-6 rounded-full border-2 border-black bg-white shadow-sm"></div>
</div>
</div>
</main>
<!-- Bottom Control Guide Bar -->
<footer class="h-12 border-t-2 border-black bg-neutral-50 px-6 flex items-center justify-between">
<div class="flex space-x-4">
<div class="h-0.5 w-12 bg-outline-variant"></div>
<div class="h-0.5 w-12 bg-outline-variant"></div>
</div>
<div class="h-0.5 w-24 bg-black"></div>
</footer>
</div>
</div>
</body></html>
