<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&amp;family=Inter:wght@100;200;300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-container": "#747474",
                    "on-error": "#ffffff",
                    "inverse-surface": "#2f3131",
                    "on-primary-container": "#ffffff",
                    "tertiary-fixed-dim": "#474747",
                    "surface-tint": "#5e5e5e",
                    "background": "#f9f9f9",
                    "surface-container-low": "#f3f3f4",
                    "on-secondary-container": "#1b1b1b",
                    "surface-variant": "#e2e2e2",
                    "surface-container-high": "#e8e8e8",
                    "on-secondary-fixed-variant": "#3b3b3b",
                    "surface-container-highest": "#e2e2e2",
                    "surface-container": "#eeeeee",
                    "on-tertiary": "#e2e2e2",
                    "on-secondary": "#ffffff",
                    "secondary": "#5e5e5e",
                    "on-tertiary-container": "#ffffff",
                    "secondary-container": "#d4d4d4",
                    "surface-container-lowest": "#ffffff",
                    "outline-variant": "#c6c6c6",
                    "tertiary": "#3b3b3b",
                    "primary-fixed": "#5e5e5e",
                    "surface-dim": "#dadada",
                    "on-background": "#1a1c1c",
                    "secondary-fixed-dim": "#ababab",
                    "secondary-fixed": "#c6c6c6",
                    "primary": "#000000",
                    "on-surface-variant": "#474747",
                    "on-error-container": "#410002",
                    "on-primary": "#e2e2e2",
                    "on-primary-fixed": "#ffffff",
                    "on-tertiary-fixed": "#ffffff",
                    "surface": "#f9f9f9",
                    "on-primary-fixed-variant": "#e2e2e2",
                    "on-tertiary-fixed-variant": "#e2e2e2",
                    "inverse-on-surface": "#f0f1f1",
                    "error": "#ba1a1a",
                    "surface-bright": "#f9f9f9",
                    "primary-fixed-dim": "#474747",
                    "outline": "#777777",
                    "inverse-primary": "#c6c6c6",
                    "primary-container": "#3b3b3b",
                    "on-surface": "#1a1c1c",
                    "on-secondary-fixed": "#1b1b1b",
                    "tertiary-fixed": "#5e5e5e",
                    "error-container": "#ffdad6"
            },
            "borderRadius": {
                    "DEFAULT": "0rem",
                    "lg": "0rem",
                    "xl": "0rem",
                    "full": "0rem"
            },
            "fontFamily": {
                    "headline": ["Space Grotesk"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .blueprint-diagonal-bg {
            background-image: repeating-linear-gradient(45deg, #c6c6c6 0, #c6c6c6 1px, transparent 0, transparent 50%);
            background-size: 10px 10px;
        }
        .x-placeholder {
            position: relative;
        }
        .x-placeholder::before, .x-placeholder::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 1px solid #777777; /* outline */
            pointer-events: none;
        }
        .x-placeholder::before {
            background: linear-gradient(to top right, transparent calc(50% - 0.5px), #777777 50%, transparent calc(50% + 0.5px));
        }
        .x-placeholder::after {
            background: linear-gradient(to bottom right, transparent calc(50% - 0.5px), #777777 50%, transparent calc(50% + 0.5px));
        }
        body {
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>
<body class="font-body text-primary selection:bg-primary-container selection:text-on-primary">
<!-- 4:3 Tablet Frame -->
<div class="relative w-[1024px] h-[768px] bg-white border-2 border-primary overflow-hidden shadow-[8px_8px_0px_0px_rgba(226,226,226,1)]">
<!-- Main Map Placeholder Section -->
<div class="absolute inset-0 x-placeholder border-primary border-2">
<!-- This container uses the ::before/::after logic for the giant 'X' -->
</div>
<!-- UI Shell Overlay (Logic from Shared Components) -->
<!-- SideNavBar Structure Implementation -->
<div class="fixed left-0 top-0 h-full w-20 flex flex-col items-center py-8 z-40 bg-white border-r-2 border-primary">
<div class="mb-12 flex flex-col items-center">
<!-- Redacted Title logic -->
<div class="h-6 w-12 bg-primary mb-1"></div>
<div class="h-1 w-8 bg-outline opacity-40"></div>
</div>
<div class="flex flex-col space-y-10">
<!-- Map Tab (Active) -->
<div class="w-12 h-12 flex items-center justify-center bg-black transition-all skew-x-2">
<div class="w-6 h-6 border border-white relative">
<div class="absolute inset-0 bg-[linear-gradient(45deg,transparent_45%,white_45%,white_55%,transparent_55%)]"></div>
</div>
</div>
<!-- Other Tabs -->
<div class="w-12 h-12 flex items-center justify-center opacity-50 hover:opacity-100 transition-all">
<div class="w-6 h-6 border border-black relative">
<div class="absolute inset-0 bg-[linear-gradient(45deg,transparent_45%,black_45%,black_55%,transparent_55%)]"></div>
</div>
</div>
<div class="w-12 h-12 flex items-center justify-center opacity-50 hover:opacity-100 transition-all">
<div class="w-6 h-6 border border-black relative">
<div class="absolute inset-0 bg-[linear-gradient(45deg,transparent_45%,black_45%,black_55%,transparent_55%)]"></div>
</div>
</div>
<div class="w-12 h-12 flex items-center justify-center opacity-50 hover:opacity-100 transition-all">
<div class="w-6 h-6 border border-black relative">
<div class="absolute inset-0 bg-[linear-gradient(45deg,transparent_45%,black_45%,black_55%,transparent_55%)]"></div>
</div>
</div>
</div>
</div>
<!-- Floating UI Components (Bottom Right Focus) -->
<div class="absolute bottom-12 right-12 flex flex-col items-end space-y-6">
<!-- GPS Button Placeholder -->
<div class="w-14 h-14 bg-white border-2 border-primary flex items-center justify-center hover:bg-primary-container group transition-all">
<div class="w-6 h-6 border border-primary group-hover:border-white relative">
<div class="absolute top-1/2 left-0 w-full h-[1px] bg-primary group-hover:bg-white"></div>
<div class="absolute left-1/2 top-0 w-[1px] h-full bg-primary group-hover:bg-white"></div>
</div>
</div>
<!-- Floating Card Placeholder -->
<div class="w-64 bg-white border-2 border-primary p-6 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
<!-- Three straight horizontal lines representing redacted text -->
<div class="space-y-4">
<div class="h-1 bg-primary w-full"></div>
<div class="h-1 bg-primary w-4/5"></div>
<div class="h-1 bg-primary w-2/3"></div>
</div>
</div>
</div>
<!-- Top Navigation Implementation (Identity Anchors) -->
<div class="absolute top-0 left-20 right-0 h-16 border-b-2 border-primary flex justify-between items-center px-8 bg-white/80 backdrop-blur-md">
<div class="flex items-center space-x-8">
<!-- Brand Anchor -->
<div class="h-4 w-32 bg-primary"></div>
<!-- Search Bar Placeholder -->
<div class="w-48 h-8 border border-outline flex items-center px-3">
<div class="w-4 h-4 border border-outline-variant mr-3"></div>
<div class="h-[2px] w-20 bg-outline-variant"></div>
</div>
</div>
<div class="flex space-x-6">
<!-- Trailing Icon Actions -->
<div class="w-6 h-6 border border-primary relative">
<div class="absolute inset-0 bg-[linear-gradient(45deg,transparent_45%,black_45%,black_55%,transparent_55%)]"></div>
</div>
<div class="w-6 h-6 border border-primary relative">
<div class="absolute inset-0 bg-[linear-gradient(45deg,transparent_45%,black_45%,black_55%,transparent_55%)]"></div>
</div>
</div>
</div>
<!-- Structural Detail: Technical Grid Overlay -->
<div class="absolute inset-0 pointer-events-none opacity-10">
<div class="w-full h-full" style="background-image: radial-gradient(#000 1px, transparent 1px); background-size: 40px 40px;"></div>
</div>
</div>
</body></html>
